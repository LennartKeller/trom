[project]
name = "trom"
version = "0.1.0"
description = "Romanize texts in various languages and script systems."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Lennart Keller", email = "lennartkeller@gmail.com" }]
keywords = ["romanization", "transliteration", "unicode", "nlp", "uroman", "icu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.3.0",
    "iso-639>=0.4.5",
    "jieba>=0.42.1",
    "khmer-nltk>=1.6",
    "laonlp>=1.2.0",
    "numpy>=1.16.0",
    "pip>=25.2",
    "pkuseg>=0.0.25",
    "protobuf>=6.33.1",
    "pycantonese>=3.4.0",
    "pyicu>=2.16",
    "pythainlp>=5.1.2",
    "sacremoses>=0.1.1",
    "spacy>=3.8.7",
    "sudachidict-core>=20251022",
    "sudachipy>=0.6.10",
    "thulac>=0.2.2",
    "uroman",
    "uroman-rs",
]

[project.scripts]
trom = "trom.cli:main"

[project.urls]
Repository = "https://github.com/LennartKeller/trom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pinned to exact commits so every trom version produces reproducible
# romanization output. To upgrade a backend, bump the rev deliberately and
# re-run the test suite (tests/test_golden_outputs.py guards against drift).
[tool.uv.sources]
# uroman 1.3.1.1
uroman = { git = "https://github.com/LennartKeller/uroman.git", rev = "0d92c2cac55f3f73192323f2838f69281d2ac957" }
# uroman-rs 0.6.2 (incl. char-boundary fixes)
uroman-rs = { git = "https://github.com/LennartKeller/uroman-rs.git", rev = "225d91f9d54002ed643725070ed4ad7841f43e75" }

[dependency-groups]
dev = [
    # Pinned spaCy models used by the Japanese/Korean/Chinese tokenizer tests
    # (otherwise get_spacy_tokenizer auto-downloads unpinned versions at runtime)
    "ja-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ja_core_news_sm-3.8.0/ja_core_news_sm-3.8.0-py3-none-any.whl",
    "ko-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/ko_core_news_sm-3.8.0/ko_core_news_sm-3.8.0-py3-none-any.whl",
    "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
    "datasets>=4.2.0",
    "ipykernel>=6.30.1",
    "ipython>=8.37.0",
    "ipywidgets>=8.1.7",
    "isort>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
]
[tool.uv.extra-build-dependencies]
    pkuseg = ["numpy>=1.16.0"]
