[project]
name = "trom"
version = "0.1.0"
description = "Romanize texts in various languages and script systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.0",
    "iso-639>=0.4.5",
    "jieba>=0.42.1",
    "khmer-nltk>=1.6",
    "laonlp>=1.2.0",
    "numpy>=1.16.0",
    "pip>=25.2",
    "pkuseg>=0.0.25",
    "protobuf>=6.33.1",
    "pycantonese>=3.4.0",
    "pyicu>=2.16",
    "pythainlp>=5.1.2",
    "sacremoses>=0.1.1",
    "spacy>=3.8.7",
    "sudachidict-core>=20251022",
    "sudachipy>=0.6.10",
    "thulac>=0.2.2",
    "uroman",
    "uroman-rs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
uroman = { git = "https://github.com/LennartKeller/uroman.git", branch = "master" }
uroman-rs = { git = "https://github.com/LennartKeller/uroman-rs.git", branch = "master" }

[dependency-groups]
dev = [
    "datasets>=4.2.0",
    "ipykernel>=6.30.1",
    "ipython>=8.37.0",
    "ipywidgets>=8.1.7",
    "isort>=6.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pytest>=8.4.2",
    "ruff>=0.13.3",
]
[tool.uv.extra-build-dependencies]
    pkuseg = ["numpy>=1.16.0"]
